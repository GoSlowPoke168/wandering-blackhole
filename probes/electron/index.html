<meta charset="utf-8">
<title>M0 Probe A - Chromium desktopCapturer</title>
<style>
  html,body{margin:0;overflow:hidden;background:#000}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;right:16px;top:16px;font:13px/1.5 Consolas,monospace;color:#0f0;
       background:rgba(0,0,0,.82);padding:12px 16px;border:1px solid #0f0;white-space:pre}
</style>
<canvas id=c></canvas><div id=hud>starting...</div>
<script>
// THROWAWAY - Milestone 0 probe. Auto-quits; Esc also quits.
const P = new URLSearchParams(location.search);
const RUN_SECONDS = parseFloat(P.get('secs') || '20');
const WGC = P.has('wgc');
const fs = require('fs'), RESULTS = 'results.txt';
try { fs.writeFileSync(RESULTS, ''); } catch (e) {}
const out = s => { try { fs.appendFileSync(RESULTS, s + String.fromCharCode(10)); } catch (e) {} };
out('--- probe A boot ok ---');

const NBITS = 8, BS = 32;          // counter blocks: 8 bits, 32px each, top-left
const hud = document.getElementById('hud'), canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias:false, depth:false, powerPreference:'high-performance' });
if (!gl) { out('FATAL: no webgl2'); hud.textContent = 'NO WEBGL2'; throw new Error('no webgl2'); }

const dbg = gl.getExtension('WEBGL_debug_renderer_info');
const RENDERER = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

const dpr = devicePixelRatio || 1;
canvas.width  = Math.round(innerWidth  * dpr);
canvas.height = Math.round(innerHeight * dpr);
const W = canvas.width, H = canvas.height;

const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0,1); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float; uniform sampler2D uTex; uniform vec2 uRes; out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy/uRes; uv.y = 1.0-uv.y; o = vec4(texture(uTex,uv).rgb,1.0); }`));
gl.linkProgram(prog); gl.useProgram(prog);
gl.uniform1i(gl.getUniformLocation(prog,'uTex'), 0);
gl.uniform2f(gl.getUniformLocation(prog,'uRes'), W, H);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR);
for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);

// --- metrics -------------------------------------------------------------
const tStart = performance.now();
let counter = 0, frames = 0, capFrames = 0, t0 = tStart, lastArrive = tStart;
let fps = 0, capFps = 0, upMs = 0, arriveMs = 0, latFrames = -1;
let latSum = 0, latN = 0, bad = 0, vfW = 0, vfH = 0, srcKind = '?';
let totFps = 0, fpsN = 0, upSum = 0, upN = 0, finished = false;
const px = new Uint8Array(NBITS * BS * 4);

function drawBlocks(v) {                    // solid rects via scissor+clear, no shader
  gl.enable(gl.SCISSOR_TEST);
  for (let i = 0; i < NBITS; i++) {
    const bit = (v >> i) & 1;
    gl.scissor(i * BS, H - BS, BS, BS);
    gl.clearColor(bit, bit, bit, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.disable(gl.SCISSOR_TEST);
}
function readBlocks() {                     // decode the DELAYED counter out of the capture
  gl.readPixels(0, H - BS/2, NBITS * BS, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let v = 0, clean = true;
  for (let i = 0; i < NBITS; i++) {
    const s = px[(i * BS + BS/2) * 4];
    if (s > 60 && s < 195) clean = false;    // ambiguous => resampled/torn, discard
    if (s >= 128) v |= (1 << i);
  }
  return clean ? v : -1;
}
function summary() {
  if (finished) return; finished = true;
  const avgFps = fpsN ? totFps / fpsN : 0, avgLat = latN ? latSum / latN : -1;
  out('');
  out('=== PROBE A SUMMARY (Chromium desktopCapturer' + (WGC ? ', WGC forced' : ', default') + ') ===');
  out('renderer       ' + RENDERER);
  out('frame source   ' + srcKind);
  out('capture res    ' + vfW + 'x' + vfH + '   (canvas ' + W + 'x' + H + ')');
  out('present fps    ' + avgFps.toFixed(1));
  out('capture fps    ' + capFps.toFixed(1));
  out('texImage2D     ' + (upN ? (upSum/upN).toFixed(2) : '?') + ' ms');
  out('LATENCY        ' + avgLat.toFixed(2) + ' frames  ~' +
      (avgLat < 0 ? -1 : (avgLat * 1000 / Math.max(avgFps,1))).toFixed(1) + ' ms');
  out('samples        n=' + latN + ', bad=' + bad);
  setTimeout(() => window.close(), 250);
}

async function run() {
  const stream = await navigator.mediaDevices.getDisplayMedia({
    video: { frameRate: 60, width: { ideal: W }, height: { ideal: H } }, audio: false });
  const track = stream.getVideoTracks()[0];
  const useProc = typeof MediaStreamTrackProcessor !== 'undefined';
  srcKind = useProc ? 'VideoFrame via MediaStreamTrackProcessor' : '<video> element fallback';
  out('probe A started: ' + srcKind + ' | renderer ' + RENDERER);

  const onFrame = (src, w, h) => {
    if (finished) return;
    vfW = w; vfH = h;
    const now = performance.now();
    arriveMs = now - lastArrive; lastArrive = now; capFrames++;

    const u0 = performance.now();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    upMs = performance.now() - u0; upSum += upMs; upN++;

    gl.viewport(0, 0, W, H);
    gl.useProgram(prog); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.drawArrays(gl.TRIANGLES, 0, 3);        // captured desktop, fullscreen

    if (frames % 10 === 0) {                  // sample sparsely: readPixels stalls
      const seen = readBlocks();
      if (seen >= 0) {
        const d = (counter - seen) & (2**NBITS - 1);
        if (d < 40) { latFrames = d; latSum += d; latN++; } else bad++;
      } else bad++;
    }
    counter = (counter + 1) & (2**NBITS - 1);
    drawBlocks(counter);                      // current counter, on top
    frames++;

    const el = now - t0;
    if (el >= 1000) {
      fps = frames * 1000 / el; capFps = capFrames * 1000 / el;
      totFps += fps; fpsN++;
      const latMs = latN ? (latSum / latN) * (1000 / Math.max(fps, 1)) : -1;
      const line = `present ${fps.toFixed(1)} fps | capture ${capFps.toFixed(1)} fps | ` +
                   `interval ${arriveMs.toFixed(1)} ms | texImage2D ${upMs.toFixed(2)} ms | ` +
                   `LATENCY ${latFrames} frames ~${latMs.toFixed(1)} ms (avg ${latN?(latSum/latN).toFixed(2):'-'} f, n=${latN}) | bad ${bad}`;
      out(line);
      hud.textContent = `PROBE A - Chromium desktopCapturer${WGC ? ' [WGC]' : ' [default]'}\n` +
        `------------------------------------------\n` + line.split(' | ').join('\n') +
        `\ncapture res    ${vfW}x${vfH}  (canvas ${W}x${H})\n${srcKind}`;
      frames = 0; capFrames = 0; t0 = now;
    }
    if (now - tStart >= RUN_SECONDS * 1000) summary();
  };

  if (useProc) {
    const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
    while (!finished) {
      const { value: f, done } = await reader.read();
      if (done) break;
      onFrame(f, f.displayWidth, f.displayHeight);
      f.close();
    }
  } else {
    const v = document.createElement('video');
    v.srcObject = stream; v.muted = true; await v.play();
    const tick = () => { if (finished) return; onFrame(v, v.videoWidth, v.videoHeight); v.requestVideoFrameCallback(tick); };
    v.requestVideoFrameCallback(tick);
  }
}
run().catch(e => { out('ERROR: ' + (e && e.message || e)); hud.textContent = 'ERROR: ' + e.message;
                   setTimeout(() => window.close(), 500); });
setTimeout(summary, RUN_SECONDS * 1000 + 4000);   // hard stop if no frames ever arrive
</script>
