<meta charset="utf-8">
<title>M0 Probe C - real shader cost on the iGPU</title>
<style>
  html,body{margin:0;overflow:hidden;background:#111}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;right:16px;top:16px;font:14px/1.6 Consolas,monospace;color:#0f0;
       background:rgba(0,0,0,.85);padding:12px 16px;border:1px solid #0f0;white-space:pre}
</style>
<canvas id=c></canvas><div id=hud>compiling...</div>
<script>
// THROWAWAY - Milestone 0 Probe C.
// Runs the REAL blackhole.glsl over a STATIC texture at native resolution and
// sweeps hole size, so the number is pure shader cost with no capture pipeline
// in the way. Answers: can the Intel UHD shade this at 2560x1600?
const fs = require('fs'), path = require('path');
const RESULTS = 'results-c.txt';
try { fs.writeFileSync(RESULTS, ''); } catch (e) {}
const out = s => { try { fs.appendFileSync(RESULTS, s + String.fromCharCode(10)); } catch (e) {} };

const P = new URLSearchParams(location.search);
const SECS_PER_LEVEL = parseFloat(P.get('each') || '3');
const LEVELS = (P.get('levels') || '0,0.05,0.15,0.3,0.5,0.75,1').split(',').map(Number);

const hud = document.getElementById('hud'), canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias:false, depth:false, powerPreference:'high-performance' });
if (!gl) { out('FATAL: no webgl2'); throw new Error('no webgl2'); }
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
const RENDERER = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

const dpr = devicePixelRatio || 1;
canvas.width  = Math.round(innerWidth  * dpr);
canvas.height = Math.round(innerHeight * dpr);
const W = canvas.width, H = canvas.height;

// ---- assemble the real shader -------------------------------------------
let src = fs.readFileSync(path.join(__dirname, '..', '..', 'shader', 'blackhole.glsl'), 'utf8');
// TOKEN_LEVEL is a #define fallback used when the cursor carries no signal.
// Swap it for a uniform so the probe can sweep hole size without recompiling.
const before = src;
src = src.replace(/^#define\s+TOKEN_LEVEL\s+.*$/m, '// TOKEN_LEVEL -> uniform (probe)');
const swapped = src !== before;

const HEADER = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D iChannel0;
uniform vec3  iResolution;
uniform float iTime;
uniform vec4  iDate;
uniform vec4  iCurrentCursorColor;
uniform vec4  iPreviousCursorColor;
uniform float iTimeCursorChange;
uniform float TOKEN_LEVEL;
out vec4 _fragOut;
`;
// Ghostty's fragCoord.y runs TOP-DOWN, opposite the Shadertoy convention the
// shader otherwise follows. WebGL is bottom-up, so flip to match.
const FOOTER = `
void main(){ mainImage(_fragOut, vec2(gl_FragCoord.x, iResolution.y - gl_FragCoord.y)); }
`;

const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(o);
    out('=== SHADER COMPILE FAILED ==='); out(log);
    hud.textContent = 'COMPILE FAILED\n\n' + log.slice(0, 1200);
    throw new Error('compile: ' + log);
  } return o; };

const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0,1); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, HEADER + src + FOOTER));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  const log = gl.getProgramInfoLog(prog);
  out('=== LINK FAILED ==='); out(log); hud.textContent = 'LINK FAILED\n' + log; throw new Error(log);
}
gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);

// ---- static "desktop" texture: text-like, so lensing has detail to bend ----
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
const x2 = cv.getContext('2d');
x2.fillStyle = '#1b1d23'; x2.fillRect(0, 0, W, H);
x2.font = '16px Consolas, monospace';
for (let y = 20; y < H; y += 22) {
  x2.fillStyle = ['#d8dee9','#88c0d0','#a3be8c','#ebcb8b'][(y/22|0) % 4];
  let line = '';
  for (let i = 0; i < 150; i++) line += '.:/\\|_=+*#abcdefghijklmnop0123456789'[(i*7 + y) % 36];
  x2.fillText(line, 12, y);
}
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR);
for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);

out('=== PROBE C - real blackhole.glsl, static texture ===');
out('renderer       ' + RENDERER);
out('resolution     ' + W + 'x' + H);
out('TOKEN_LEVEL uniform swap: ' + (swapped ? 'ok' : 'FAILED - define not found'));
out('shader compiled + linked CLEAN (no source edits beyond the define swap)');
out('');
out('level |    fps |  ms/frame | verdict@60Hz | verdict@165Hz');
out('------+--------+-----------+--------------+--------------');

// ---- sweep ---------------------------------------------------------------
let li = 0, frames = 0, tPhase = performance.now(), t0 = tPhase, done = false;
const rows = [];
function finish() {
  if (done) return; done = true;
  out('');
  const worst = rows.reduce((a, b) => a.fps < b.fps ? a : b, rows[0] || { fps: 0, lvl: -1 });
  out('worst case: level ' + worst.lvl + ' -> ' + worst.fps.toFixed(1) + ' fps (' +
      (1000/worst.fps).toFixed(1) + ' ms/frame)');
  setTimeout(() => window.close(), 300);
}
let announced = -1, phaseFrames = 0;
function frame() {
  if (done) return;
  const now = performance.now();
  const lvl = LEVELS[li];
  if (announced !== li) { announced = li; phaseFrames = 0; out('  -> starting level ' + lvl + ' ...'); }
  phaseFrames++;

  gl.viewport(0, 0, W, H);
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(U('iChannel0'), 0);
  gl.uniform3f(U('iResolution'), W, H, 1);
  gl.uniform1f(U('iTime'), (now - t0) / 1000);
  gl.uniform4f(U('iDate'), 2026, 9, 14, (now - t0) / 1000);
  gl.uniform4f(U('iCurrentCursorColor'), 0, 0, 0, 1);   // no signature -> falls back to TOKEN_LEVEL
  gl.uniform4f(U('iPreviousCursorColor'), 0, 0, 0, 1);
  gl.uniform1f(U('iTimeCursorChange'), (now - t0) / 1000);
  gl.uniform1f(U('TOKEN_LEVEL'), lvl);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  frames++;

  const el = now - tPhase;
  if (el >= SECS_PER_LEVEL * 1000) {
    const fps = frames * 1000 / el, ms = 1000 / fps;
    rows.push({ lvl, fps });
    const v60  = ms < 16.7 ? 'OK' : (ms < 33 ? 'judder(30)' : 'FAIL');
    const v165 = ms < 6.1  ? 'OK' : (ms < 16.7 ? 'drops to 60' : 'FAIL');
    out(String(lvl).padStart(5) + ' | ' + fps.toFixed(1).padStart(6) + ' | ' +
        ms.toFixed(2).padStart(9) + ' | ' + v60.padStart(12) + ' | ' + v165.padStart(13));
    hud.textContent = 'PROBE C - real shader on ' + RENDERER.slice(0, 40) +
      '\n' + W + 'x' + H + '\n\nlevel ' + lvl + '  ->  ' + fps.toFixed(1) + ' fps  (' + ms.toFixed(1) + ' ms)' +
      '\n\n' + (li + 1) + '/' + LEVELS.length;
    frames = 0; tPhase = now; li++;
    if (li >= LEVELS.length) { finish(); return; }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => { out('  !! HARD TIMEOUT during level ' + LEVELS[li] +
  ' after ' + phaseFrames + ' frames in ' + ((performance.now()-tPhase)/1000).toFixed(1) + 's' +
  '  => ~' + ((performance.now()-tPhase)/Math.max(phaseFrames,1)).toFixed(0) + ' ms/frame'); finish(); },
  (LEVELS.length * SECS_PER_LEVEL + 150) * 1000);
</script>
