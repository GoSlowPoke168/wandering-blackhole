<meta charset="utf-8">
<title>Black Hole Pomodoro</title>
<style>
  html,body{margin:0;overflow:hidden;background:transparent}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:16px;top:16px;font:12px/1.5 Consolas,monospace;color:#ffb000;
       background:rgba(0,0,0,.72);padding:8px 12px;border:1px solid rgba(255,176,0,.5);
       white-space:pre;border-radius:3px;pointer-events:none}
  #hud.off{display:none}
</style>
<canvas id=c></canvas><div id=hud class=off>starting…</div>
<script>
'use strict';
const { ipcRenderer } = require('electron');
const { build } = require('./shader-patch.js');
const G = require('./geometry.js');

const hud = document.getElementById('hud'), canvas = document.getElementById('c');
const SMOKE = process.env.SMOKE;
const slog = SMOKE ? (t => { try { require('fs').appendFileSync('smoke.txt', t + '\n'); } catch(e){} }) : (()=>{});
const fatal = m => { slog('FATAL: ' + m); try { ipcRenderer.send('renderer-fatal', m); } catch (e) {} };

const gl = canvas.getContext('webgl2', {
  alpha: true, premultipliedAlpha: true, antialias: false, depth: false,
  powerPreference: 'high-performance',
});
if (!gl) { fatal('no webgl2'); throw new Error('no webgl2'); }

const dpr = devicePixelRatio || 1;
canvas.width  = Math.round(innerWidth  * dpr);
canvas.height = Math.round(innerHeight * dpr);
const W = canvas.width, H = canvas.height;

// ---- shader ---------------------------------------------------------------
let patched;
try { patched = build(); }
catch (e) { hud.classList.remove('off'); hud.textContent = 'SHADER PATCH FAILED\n' + e.message; fatal(e.message); throw e; }

const sh = (t, s) => {
  const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(o);
    hud.classList.remove('off'); hud.textContent = 'COMPILE FAILED\n' + log.slice(0, 900);
    fatal('shader compile: ' + log); throw new Error(log);
  }
  return o;
};
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0,1); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, patched.source));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  const log = gl.getProgramInfoLog(prog);
  hud.classList.remove('off'); hud.textContent = 'LINK FAILED\n' + log; fatal(log); throw new Error(log);
}
gl.useProgram(prog);

const U = {};
for (const n of ['iChannel0','iResolution','iTime','iDate','iCurrentCursorColor',
  'iPreviousCursorColor','iTimeCursorChange','TOKEN_LEVEL','uDesktopXform',
  'uDriftTime','uCenter','uCenterPin'].concat(patched.promoted))
  U[n] = gl.getUniformLocation(prog, n);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR);
for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // premultiplied source

// ---- state: owned by main, mirrored here ----------------------------------
let S = { mode: 'free', level: 0.25, motion: 'wander', pinned: [0.5, 0.35],
          driftBase: 0, driftEpoch: Date.now(), driftSpeed: 1,
          virt: { x:0, y:0, width:1, height:1 }, bounds: { x:0, y:0, width:1, height:1 },
          look: patched.defaults, hud: false, hidden: false, idle: 1, monitors: 1,
          pomodoro: { phase: 'idle', remaining: '00:00' } };
let setup = null;
let shownLevel = 0, shownCenter = [0.5, 0.35], haveCenter = false;
let frames = 0, fps = 0, tFps = performance.now(), capW = 0, capH = 0;
let dropped = 0, droppedRate = 0, blanked = false, shading = true;
const t0 = performance.now();

// Same deterministic wander every monitor evaluates, off a clock shared by all of
// them, so a hole straddling two screens lines up across the seam.
function holeUV() {
  if (S.motion === 'still') return S.pinned;
  const t = S.driftBase + (Date.now() - S.driftEpoch) / 1000 * S.driftSpeed;
  return G.wanderUV(t, shownLevel, S.virt.width / Math.max(1, S.virt.height));
}

function reportHud(now) {
  const idle = S.idle !== undefined ? S.idle : 1;
  const why = S.hidden ? '  [hidden]' : (!shading ? '  [not shading]' : '');
  slog(`fps ${fps.toFixed(1)} | dropped ${droppedRate}/s | mode ${S.mode} | level ${shownLevel.toFixed(2)}` +
       ` | idle ${idle.toFixed(2)} (${S.idleSec ?? -1}s) | uv ${shownCenter.map(v=>v.toFixed(2))}${why}`);
  if (!S.hud) return;
  const p = S.pomodoro || {};
  hud.textContent =
    `BLACK HOLE POMODORO${S.monitors > 1 ? `   (monitor of ${S.monitors})` : ''}\n` +
    `mode     ${S.hidden ? 'hidden' : S.mode}` +
    `${S.mode === 'pomodoro' && !S.hidden ? `  ${p.phase} ${p.remaining}${p.running ? '' : ' (paused)'}` : ''}` +
    `${S.mode === 'eyebreak' && !S.hidden && S.eyebreak
        ? (S.eyebreak.inBreak ? `  LOOK AWAY  ${S.eyebreak.remaining}`
                              : `  next in ${S.eyebreak.remaining}`) : ''}\n` +
    `level    ${shownLevel.toFixed(2)}  ->  ${S.level.toFixed(2)}\n` +
    `motion   ${S.motion}  ${S.motion === 'wander' ? S.driftSpeed + 'x' : ''}\n` +
    `hole uv  ${shownCenter.map(v => v.toFixed(2)).join(', ')}${shading ? '' : '  (off this screen)'}\n` +
    `presence ${idle >= 1 ? 'here' : (idle <= 0 ? 'away — faded out' : 'fading ' + idle.toFixed(2))}\n` +
    `fps      ${fps.toFixed(1)}   dropped ${droppedRate}/s\n` +
    `capture  ${capW}x${capH}   canvas ${W}x${H}\n` +
    `\nctrl+alt  Up/Down size  P mode  S start\n` +
    `          X hide  K pin  H hud  Q quit`;
}

ipcRenderer.on('setup', (_e, s) => { setup = s; slog('setup: display ' + s.displayId + ' ' +
  JSON.stringify(s.display) + ' window ' + JSON.stringify(s.window)); });
ipcRenderer.on('state', (_e, s) => {
  const wasHidden = S.hidden;
  S = s;
  hud.classList.toggle('off', !s.hud);
  if (s.hidden !== wasHidden) s.hidden ? stopCapture() : startCapture();
});

// Canvas uv -> this display's full-screen uv. Windows clamps the window to the work
// area (it stops above the taskbar) while the capture covers the whole display, so
// without this the lens samples a squashed desktop that does not line up.
let xform = [1, 1, 0, 0], onSetup = null;
const setupReady = new Promise(res => { onSetup = res; });
ipcRenderer.on('setup', (_e, s) => {
  const k = s.display.scale;
  const Dw = s.display.width * k, Dh = s.display.height * k;
  const wx = (s.window.x - s.display.x) * k, wy = (s.window.y - s.display.y) * k;
  const ww = s.window.width * k,  wh = s.window.height * k;
  xform = [ww / Dw, wh / Dh, wx / Dw, wy / Dh];
  if (onSetup) { onSetup(s); onSetup = null; }
});

// ---- capture --------------------------------------------------------------
let stream = null, reader = null, latest = null, haveFrame = false, generation = 0;

function stopCapture() {
  generation++;
  if (latest) { try { latest.close(); } catch (e) {} latest = null; }
  if (reader) { try { reader.cancel(); } catch (e) {} reader = null; }
  if (stream) { for (const t of stream.getTracks()) t.stop(); stream = null; }
  haveFrame = false;
  slog('capture stopped');
}

// Every definitive sign the stream is dead lands here: blank first so a dead stream
// never lenses a stale desktop, then come back once the display is awake again.
let restartTimer = null;
function restartCapture() {
  stopCapture();
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => { if (!S.hidden) startCapture(); }, 500);
}
ipcRenderer.on('restart-capture', () => { if (!S.hidden) restartCapture(); });

async function startCapture() {
  const s = await setupReady;
  if (stream) return;
  const gen = ++generation;
  // Ask for the FULL DISPLAY resolution, not the canvas size. The canvas covers only
  // the work area; asking for its height made Chromium scale the whole desktop down
  // to fit - a self-inflicted quality loss, not a Chromium limitation.
  const capW0 = Math.round(s.display.width  * s.display.scale);
  const capH0 = Math.round(s.display.height * s.display.scale);
  slog(`requesting capture at ${capW0}x${capH0} (display ${s.displayId}), canvas ${W}x${H}`);
  let st;
  try {
    st = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 60, width: { ideal: capW0 }, height: { ideal: capH0 } }, audio: false });
  } catch (e) {
    slog('capture request failed: ' + e.message);
    if (gen === generation) restartCapture();
    return;
  }
  if (gen !== generation) { for (const t of st.getTracks()) t.stop(); return; }   // hidden again meanwhile
  stream = st;
  const track = st.getVideoTracks()[0];
  slog('capture started: ' + track.label);
  track.onended = () => { slog('capture track ended'); if (gen === generation) restartCapture(); };

  if (typeof MediaStreamTrackProcessor !== 'undefined') {
    // Newest frame always wins. Draining a backlog in order would mean shading
    // already-stale frames and adding latency on top of the unavoidable minimum.
    reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
    const pump = async () => {
      const r = reader;
      for (;;) {
        let out;
        try { out = await r.read(); } catch (e) { if (gen === generation) restartCapture(); return; }
        if (out.done || r !== reader) {
          if (out.value) out.value.close();
          if (out.done && gen === generation) restartCapture();
          return;
        }
        if (latest) { latest.close(); dropped++; }
        latest = out.value;
      }
    };
    pump();
  } else {
    const v = document.createElement('video');
    v.srcObject = st; v.muted = true; await v.play();
    fallbackVideo = v;
  }
}
let fallbackVideo = null;

// ---- render ---------------------------------------------------------------
// Driven by requestAnimationFrame, deliberately NOT by capture frames: Chromium only
// delivers a frame when the screen changes, so gating on them froze all animation on a
// static desktop - the hole stopped drifting and size changes did not appear.
function frame() {
  // While hidden there is nothing to animate, so drop off the vsync clock entirely
  // rather than spinning at refresh rate doing nothing - this app is meant to be able
  // to sit hidden for hours.
  if (S.hidden) setTimeout(frame, 250); else requestAnimationFrame(frame);
  const now = performance.now(), t = (now - t0) / 1000;

  if (latest) {
    const f = latest; latest = null;
    capW = f.displayWidth; capH = f.displayHeight;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, f);
    f.close();
    haveFrame = true;
  } else if (fallbackVideo && fallbackVideo.videoWidth) {
    capW = fallbackVideo.videoWidth; capH = fallbackVideo.videoHeight;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fallbackVideo);
    haveFrame = true;
  }

  shownLevel += (S.level - shownLevel) * 0.12;
  const target = holeUV();
  if (!haveCenter) { shownCenter = target.slice(); haveCenter = true; }
  else for (let i = 0; i < 2; i++) shownCenter[i] += (target[i] - shownCenter[i]) * 0.08;

  // This monitor's own uv for the hole, and whether it is close enough to be worth
  // shading at all. On a multi-monitor setup the screens the hole is nowhere near do
  // no work, so extra monitors cost essentially nothing.
  const winUV = G.toWindowUV(shownCenter, S.bounds, S.virt);
  shading = !S.hidden && haveFrame && shownLevel > 0.002 && G.shouldShade(winUV, shownLevel);

  if (!shading) {
    if (!blanked) {
      gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      blanked = true;
    }
  } else {
    blanked = false;
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(U.iChannel0, 0);
    gl.uniform3f(U.iResolution, W, H, 1);
    gl.uniform1f(U.iTime, t);
    gl.uniform4f(U.iDate, 2026, 9, 14, t);
    gl.uniform4f(U.iCurrentCursorColor, 0, 0, 0, 1);   // no signature -> use TOKEN_LEVEL
    gl.uniform4f(U.iPreviousCursorColor, 0, 0, 0, 1);
    gl.uniform1f(U.iTimeCursorChange, t);
    gl.uniform1f(U.TOKEN_LEVEL, shownLevel);
    gl.uniform4fv(U.uDesktopXform, xform);
    gl.uniform1f(U.uDriftTime, 0);
    gl.uniform2f(U.uCenter, winUV[0], winUV[1]);
    gl.uniform1f(U.uCenterPin, 1);      // the host always owns the position now
    for (const n of patched.promoted) {
      const v = S.look[n];
      if (U[n] && v !== undefined) gl.uniform1f(U[n], v);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  frames++;
  if (now - tFps >= 1000) {
    fps = frames * 1000 / (now - tFps); frames = 0; tFps = now;
    droppedRate = dropped; dropped = 0;
    reportHud(now);
  }
}

setupReady.then(() => { if (!S.hidden) startCapture(); });
requestAnimationFrame(frame);
</script>
