name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: cmd
        run: native\build.bat

      - name: Unit tests
        shell: cmd
        run: native\test\run.bat

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash native\WanderingBlackHole.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WanderingBlackHole.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WanderingBlackHole
          path: |
            native/WanderingBlackHole.exe
            SHA256SUMS.txt

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: native/WanderingBlackHole.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" native/WanderingBlackHole.exe SHA256SUMS.txt --generate-notes
